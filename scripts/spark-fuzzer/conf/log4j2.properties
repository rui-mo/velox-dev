# Logging of the Spark Connect server used as the reference DB by the Velox
# Spark fuzzers. setup.sh copies this file to $SPARK_HOME/conf.
#
# Logs warnings and errors only. At the info level, the server logs every
# request with its input data and the generated code of the queries that fail to
# compile, which grew a log to 970 MB in 5 hours of fuzzing.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex
