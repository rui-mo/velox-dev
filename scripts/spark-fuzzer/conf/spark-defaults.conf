# Spark configs of the Spark Connect server used as the reference DB by the
# Velox Spark fuzzers. setup.sh copies this file to $SPARK_HOME/conf and
# replaces @SPARK_FUZZER_HOME@.

# Executors run in separate JVMs so that running out of memory can't take down
# the whole Connect server. A dead executor gets relaunched.
spark.master local-cluster[1,4,3072]
spark.executor.memory 2g
# Fail only the task, not the executor, on an OutOfMemoryError, e.g. when an
# expression allocates an array of 1 billion elements. Relaunching the executor
# takes seconds, and the fuzzers hit such errors often.
spark.executor.killOnFatalError.depth 0
spark.executor.extraJavaOptions -Duser.timezone=America/Los_Angeles
spark.driver.memory 8g
spark.driver.extraJavaOptions -Duser.timezone=America/Los_Angeles
spark.driver.cores 1
spark.task.maxFailures 1
spark.deploy.maxExecutorRetries -1
# Kill tasks that keep running after their query is interrupted, e.g. on a
# timeout. The executor is killed if a task doesn't stop within the timeout.
spark.task.reaper.enabled true
spark.task.reaper.killTimeout 60s
spark.local.dir @SPARK_FUZZER_HOME@/tmp
spark.sql.warehouse.dir @SPARK_FUZZER_HOME@/spark-warehouse
spark.sql.shuffle.partitions 1
# Velox evaluates Spark functions with ANSI mode disabled by default
# ('spark.ansi_enabled'), while Spark 4 enables ANSI mode by default.
spark.sql.ansi.enabled false
# Must match the session timezone used by the Velox fuzzers.
spark.sql.session.timeZone America/Los_Angeles
# Parquet files written by Velox carry no Spark version metadata. Read
# ancient dates and timestamps as-is instead of failing.
spark.sql.parquet.datetimeRebaseModeInRead CORRECTED
spark.sql.parquet.int96RebaseModeInRead CORRECTED
# Velox keeps the last value of duplicate map keys by default
# ('throw_exception_on_duplicate_map_keys').
spark.sql.mapKeyDedupPolicy LAST_WIN
# Velox matches the interpreted evaluation of Spark expressions, which differs
# from the generated code of some expressions.
spark.sql.codegen.wholeStage false
spark.sql.codegen.factoryMode NO_CODEGEN
spark.ui.enabled false
